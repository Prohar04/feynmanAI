# Render Blueprint for Feynman AI
# The backend container runs migrations, the API and the BullMQ worker
# together via server/scripts/docker-start.sh, so one web service is enough.

services:
  - name: fynman-redis
    type: keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction # BullMQ requires noeviction
    ipAllowList: [] # internal connections only (from fynman-api)

  - name: fynman-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: / # '/' responds instantly; /health aggregates deps
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: WS_PATH
        value: /ws

      # Neon connection string, entered in the Render dashboard
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: fynman-redis
          type: keyvalue
          property: connectionString

      # Auto-generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 5m
      - key: REFRESH_JWT_EXPIRES_IN
        value: 15d
      - key: COOKIE_SAME_SITE
        value: none

      # Keep worker memory down on the 512 MB instance
      - key: AUDIO_PROCESSING_CONCURRENCY
        value: 1

      # MVP feature flags
      - key: ENABLE_AUDIO_PROCESSING_QUEUE
        value: true
      - key: ENABLE_REALTIME_FEEDBACK
        value: true
      - key: ENABLE_FINAL_EVALUATION
        value: true


      # --- AI providers, vector DB and storage ---
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_PROVIDER
        value: openrouter
      - key: REALTIME_MODEL
        value: google/gemini-2.5-flash
      - key: FINAL_EVALUATION_MODEL
        value: anthropic/claude-sonnet-4
      - key: HELPER_MODEL
        value: meta-llama/llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_MODEL_ENDPOINT
        value: https://openrouter.ai/api/v1/embeddings
      - key: STT_PROVIDER
        value: groq
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: BULLMQ_PREFIX
        value: FeynmanAI
      - key: LOG_LEVEL
        value: info
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: SESSION_TIMEOUT_MINUTES
        value: 120
      - key: MAX_TRANSCRIPT_CHUNKS
        value: 500
      - key: REDIS_DEFAULT_EXPIRATION
        value: 1296000
      - key: ENABLE_ANALYTICS
        value: false
      - key: LLM_ANALYSIS_INTERVAL
        value: 30

      # Entered in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Set these in the Render dashboard (not stored in git)
      # Set once the new frontend is deployed (sub-project 1).
      # Drives CORS and the Socket.IO origin allowlist.
      # localhost:3000/3001/5173 are always allowed by server.ts.
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set after the service URL is known (Task 5), then changed to
      # https://api.fynmanai.com/api/auth/google/callback in Task 8.
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ARCJET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SECURE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
